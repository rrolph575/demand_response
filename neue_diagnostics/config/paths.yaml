# Paths and run configuration for the NEUE diagnostics pipeline.
#
# SWAPPING INPUTS: change `sweep_root` and/or the per-system `pras` entries here,
# then re-run from stage 00. Nothing downstream hardcodes a path, case name, or
# region list.

# Root containing <system>/results/*.h5 and the .pras inputs' parent directory.
sweep_root: /projects/reedsweto/ssundar/FY26_largeloads_DR/dr_sweep_results
pras_root: /projects/reedsweto/ssundar/FY26_largeloads_DR

# Where this pipeline writes. Relative paths resolve against the project root.
cache_dir: cache
output_dir: outputs

systems:
  pjm:
    label: PJM
    results_subdir: pjm_neue1/results
    cases_csv: pjm_neue1/cases.csv
    # Files in results/ that are NOT part of the high-DC sweep (matched on stem).
    # baseline_zero_dr is a BASE-DC zero-DR control (NEUE 1.10, ~= baseline.h5);
    # keeping it would create a second base-DC no-DR reference and make stage 04's
    # DC-penalty math ambiguous. shed_1h_timeseries is NOT excluded -- it is a real
    # high-DC sensitivity (always-on 100% shed, schema 2).
    exclude: [baseline_zero_dr]
    # Hours to add to the file timestamps to reach this system's LOCAL time.
    # The PRAS timestamps are stamped +00:00 but the data is really Central
    # Standard Time (UTC-6): ReEDS converts UTC weather to tz_out='Etc/GMT+6'
    # (= UTC-6) for every region -- confirmed in ReEDS input_processing/
    # outage_rates.py and by solar centroids landing on the CST prediction to
    # <0.1 h for both systems. PJM is Eastern, one hour AHEAD of Central, so
    # +1 converts the stored CST hour to Eastern local. (Was -5 originally,
    # then 0; +1 is the final value.) NOTE: separate from the DR availability
    # convention (analysis.yaml: dr_avail_utc_offset), left as-is.
    local_utc_offset: 1
    pras:
      base: PJM_PRAS_2032i0_neue1.pras
      high: PJM_PRAS_2032i0_neue1_eer_central.pras
    # Always-on shed (shed_1h_timeseries) deep-dive -- the only DR case analyzed
    # as of 2026-09. Lives in the *_samples/ dir, separate from the sweep above;
    # resolves against sweep_root. PJM's copy here is identical to the one in
    # results_subdir; ERCOT's exists ONLY in its _samples dir.
    always_on_shed_h5: pjm_neue1_samples/results/shed_1h_timeseries.h5
  ercot:
    label: ERCOT
    results_subdir: ercot_neue1/results
    cases_csv: ercot_neue1/cases.csv
    # 0: the data's native frame is Central Standard Time (see PJM note), and
    # ERCOT *is* Central, so the stored hour is already ERCOT local. Was -6.
    local_utc_offset: 0
    pras:
      base: ERCOT_PRAS_2032i1_neue1.pras
      high: ERCOT_PRAS_2032i1_neue1_eer_central.pras
    always_on_shed_h5: ercot_neue1_samples/results/shed_1h_timeseries.h5

# Python environment used by the slurm wrappers. Verified to contain
# h5py/numpy/pandas/matplotlib/pyyaml. Deliberately no pyarrow dependency.
env:
  conda_prefix: /home/rrolph/.conda-envs/reeds2

# Filled in by the user; slurm/*.sh read these. Left blank on purpose so no
# allocation is ever hardcoded in a script.
slurm:
  account: ""
  partition: ""
  time: "02:00:00"
  mem: "80G"
  cpus: 8
